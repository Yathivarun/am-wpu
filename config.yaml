# WPU Client Configuration

log_level: "INFO"

services:
  slideshow:
    enabled: true
    full_screen: true
    advance_time: 2
    image_directory: "stock_images"
    image_extensions:
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - "*.gif"
      - "*.bmp"
      - "*.webp"
    background_color: "black"
    scale_mode: "fill"  # fill, fit, crop
    sort_mode: "numeric"  # numeric, alphabetical
    face_sketch_directory: "face_stock_images"  # diagnostic: <dir>/male, <dir>/female

  face_recognition:
    enabled: true
    camera_id: 0
    n: 4
    # Sandbox (ekanth docker-compose) host = 192.168.1.11, API published on 28000:8000
    api_endpoint: "http://192.168.1.11:28000/api/v1/identify/"
    wpu_endpoint: "http://192.168.1.11:28000/api/v1/wpu/images"
    detection_interval: 1  # seconds between captures
    min_face_size: 100  # minimum face size in pixels
    display_result: true  # show result on screen overlay
    overlay_hide_delay: 3  # seconds to hide overlay
    person_timeout: 3  # seconds without face before person is considered left
    # Diagnostic (offline) mode — match against local seeded gallery, no server.
    # Enable here or with the --diagnostic CLI flag. Seed with tools/seed_face.py.
    diagnostic_mode: false
    diagnostic_gallery_dir: "diagnostic_gallery"
    diagnostic_match_threshold: 0.5  # cosine distance gate for a local match
