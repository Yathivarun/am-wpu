[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wpu-client"
version = "0.1.0"
description = "WPU Client - Face recognition slideshow with multiple services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygobject==3.42.2",
    "pyyaml",
    # ── NumPy 1.x pin, and why opencv is pinned with it ──────────────────
    # picamera2 on the Pi is built against the NumPy 1.x C ABI, so resolving
    # NumPy to 2.x makes the first run die on import with a binary
    # incompatibility ("_ARRAY_API not found" / "compiled using NumPy 1.x
    # cannot be run in NumPy 2.x"). Unpinned, uv.lock resolved to 2.4.2 and
    # every fresh install needed a manual
    # `pip install --force-reinstall numpy==1.26.4` to recover.
    #
    # opencv-python has to be pinned in lockstep: 4.12.0.88 and later declare
    # `numpy>=2` on Python >= 3.9, so leaving opencv free makes the two
    # requirements unsatisfiable and `uv sync` fails to resolve. 4.11.0.86 is
    # the last release that still accepts NumPy 1.x.
    #
    # These two move together. Unpin only when picamera2 on the target Pi OS
    # ships built against NumPy 2.x, and re-test on-device.
    "opencv-python==4.11.0.86",
    "numpy==1.26.4",
    # Runs the production recogniser: models/mobilefacenet.onnx (512-D), whose
    # vectors are what the registration server's `auraface` gallery holds. NOT
    # optional — face_service aborts the whole recognition thread if the import
    # fails, so an install without it leaves the kiosk showing stock images only.
    "onnxruntime>=1.26.0",
    "httpx",
    "pydantic",
    "setuptools==80.10.2",
    "scipy",
    "picamera2",
    "psutil",
]

[project.optional-dependencies]
# Deprecated, kept empty so existing `uv sync --extra research` invocations on
# provisioned devices keep working. It used to carry onnxruntime, back when
# `mobilenet` was treated as a research model; that model is now the production
# recogniser and onnxruntime is a base dependency above. Nothing needs this.
research = []

# Lint/test tooling. Deliberately excludes picamera2/pygobject's system
# counterparts — CI installs this group only (no hardware/GTK stack), so
# tests stick to modules that don't need a camera or a display.
#   dev use:  pip install -e '.[dev]'
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# `wpu_client` is the only importable package. Without this, setuptools'
# flat-layout auto-discovery treats data/, config/, models/ and systemd/ as
# top-level packages too and aborts the build with
# "Multiple top-level packages discovered in a flat-layout".
# main.py stays a plain entry script (run by path from WorkingDirectory),
# not an installed top-level module — hence the empty py-modules.
[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["wpu_client*"]
namespaces = false

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["scripts/benchmarks", "archive"]

[tool.ruff.lint]
# Deliberately no "UP" (pyupgrade): the codebase uses Optional[X] pervasively
# (32 call sites) and switching that to X | None is a pure style migration,
# out of scope for a CI-setup change. Revisit separately if wanted.
select = ["E", "F", "I", "B"]
# B008: FastAPI/pydantic-style `Field(...)` defaults are the pattern used
# throughout wpu_client/models and wpu_client/config — not a real footgun here.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# gi.require_version(...) must run before `from gi.repository import ...` —
# PyGObject picks the wrong GTK ABI otherwise — so these imports can't move
# to the top of the file without breaking at runtime.
"wpu_client/services/slideshow/slideshow_service.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
